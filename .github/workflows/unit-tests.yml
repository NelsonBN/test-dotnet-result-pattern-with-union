name: 'Unit Tests'


on:
  workflow_dispatch:

  pull_request:
    types: [opened, reopened, edited, synchronize]
    branches:
      - main

  push:
    branches:
      - main


env:
  # Set up the .NET environment to improve performance and reliability
  DOTNET_CLI_TELEMETRY_OPTOUT: true # Disable .NET CLI telemetry
  DOTNET_NOLOGO: true # Disable .NET CLI logo
  DOTNET_SYSTEM_CONSOLE_ALLOW_ANSI_COLOR_REDIRECTION: true # Enable ANSI color redirection
  TERM: xterm # Enable ANSI color redirection
  NUGET_XMLDOC_MODE: skip # Disable NuGet XML documentation generation


permissions: {}


# A new push to the same PR supersedes the previous run
concurrency:
  group: unit-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true


jobs:

  # Builds and runs every unit-test project of the solution (tests/*.Tests); the benchmarks project is not a test suite
  unit-tests:
    name: "Unit tests"
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
    - name: "Checkout"
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

    - name: "Setup .NET"
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
      with:
        global-json-file: 'global.json'

    - name: "Restore dependencies"
      run: dotnet restore

    - name: "Build"
      run: dotnet build --configuration Release --no-restore

    - name: "Run unit tests"
      run: dotnet test --solution test-dotnet-result-pattern-with-union.slnx --configuration Release --no-build
