name: 'Benchmarks Tests'


on:
  workflow_dispatch:

  pull_request:
    types: [opened, reopened, edited, synchronize]
    branches:
      - main


env:
  BENCHMARKS_PROJECT: 'tests/Result.Benchmarks'
  BENCHMARKS_ARTIFACTS: 'BenchmarkDotNet.Artifacts'

  # Set up the .NET environment to improve performance and reliability
  DOTNET_CLI_TELEMETRY_OPTOUT: true # Disable .NET CLI telemetry
  DOTNET_NOLOGO: true # Disable .NET CLI logo
  DOTNET_SYSTEM_CONSOLE_ALLOW_ANSI_COLOR_REDIRECTION: true # Enable ANSI color redirection
  TERM: xterm # Enable ANSI color redirection
  NUGET_XMLDOC_MODE: skip # Disable NuGet XML documentation generation


permissions: {}


# Benchmarks are long-running: a new push to the same PR supersedes the previous run
concurrency:
  group: benchmarks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true


jobs:

  # Builds the matrix from the source: every .cs file under the benchmarks project that has a [Benchmark] method
  # contributes its (first) class, so adding a new benchmark class needs no change in this workflow.
  discover:
    name: "Discover benchmarks"
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}

    steps:
    - name: "Checkout"
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

    - name: "Discover benchmark classes"
      id: discover
      shell: bash
      run: |
        set -euo pipefail

        classes=()
        while IFS= read -r file; do
          classes+=("$(grep -m1 -oP '\bclass\s+\K\w+' "${file}")")
        done < <(grep -rlE '^\s*\[Benchmark(\(|\])' "${BENCHMARKS_PROJECT}" --include='*.cs' | sort)

        if [ "${#classes[@]}" -eq 0 ]; then
          echo "::error::No benchmark classes found in ${BENCHMARKS_PROJECT}"
          exit 1
        fi

        # GitHub allows at most 256 jobs per matrix
        if [ "${#classes[@]}" -gt 256 ]; then
          echo "::error::${#classes[@]} benchmark classes found, a matrix supports at most 256 jobs"
          exit 1
        fi

        # Class names become part of filters, job names, artifact names and PR comment headers
        duplicates="$(printf '%s\n' "${classes[@]}" | sort | uniq -d)"
        if [ -n "${duplicates}" ]; then
          echo "::error::Duplicated benchmark class names: ${duplicates}"
          exit 1
        fi

        matrix="$(printf '%s\n' "${classes[@]}" | jq -R . | jq -sc '{include: map({name: .})}')"
        echo "matrix=${matrix}" >> "${GITHUB_OUTPUT}"

        {
          echo "### Benchmarks to run (${#classes[@]})"
          printf -- '- `%s`\n' "${classes[@]}"
        } >> "${GITHUB_STEP_SUMMARY}"


  run-benchmarks:
    name: "Benchmarks (${{ matrix.name }})"
    needs: discover
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write

    strategy:
      # Each class runs alone on its own runner, so benchmarks never compete for CPU.
      # Only 4 run at a time (also keeps well below the concurrent jobs limit of the plan); the others wait in the queue for a free slot.
      max-parallel: 4
      # One failing class must not cancel the remaining ones
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}

    env:
      BENCHMARKS_REPORT: 'benchmark-report-${{ matrix.name }}.md'
      BENCHMARKS_COMMENT: 'benchmark-comment-${{ matrix.name }}.md'

    steps:
    - name: "Checkout"
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

    - name: "Setup .NET"
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
      with:
        global-json-file: 'global.json'

    - name: "Restore dependencies"
      run: dotnet restore

    - name: "Build"
      run: dotnet build ${{ env.BENCHMARKS_PROJECT }} --configuration Release --no-restore

    - name: "Run benchmarks"
      run: dotnet run --project ${{ env.BENCHMARKS_PROJECT }} --configuration Release --no-build -- --filter '*.${{ matrix.name }}.*' --exporters github json --inProcess

    - name: "Build benchmark report"
      if: success()
      shell: bash
      env:
        BENCHMARK_CLASS: ${{ matrix.name }}
      run: |
        {
          echo "## Benchmark results: ${BENCHMARK_CLASS}"
          echo
          echo "- **Commit:** \`${GITHUB_SHA}\`"
          echo "- **Runner:** \`${RUNNER_OS}/${RUNNER_ARCH}\` (shared GitHub-hosted runner, results are indicative only)"
          echo "- **Toolchain:** in-process (BenchmarkDotNet 0.15.8 does not support net11 yet, so isolation is reduced)"
          echo
          for file in "${BENCHMARKS_ARTIFACTS}"/results/*-report-github.md; do
            echo "### $(basename "${file}" -report-github.md)"
            echo
            cat "${file}"
            echo
          done
        } > "${BENCHMARKS_REPORT}"

        # PR comments are limited to 65536 characters; the job summary (1 MiB) always has the full report
        if [ "$(wc -c < "${BENCHMARKS_REPORT}")" -gt 60000 ]; then
          {
            head -c 60000 "${BENCHMARKS_REPORT}"
            echo
            echo
            echo "_Report truncated, see the full one in the [workflow run summary](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})._"
          } > "${BENCHMARKS_COMMENT}"
        else
          cp "${BENCHMARKS_REPORT}" "${BENCHMARKS_COMMENT}"
        fi

    - name: "Publish benchmark summary"
      if: success()
      shell: bash
      run: cat "${BENCHMARKS_REPORT}" >> "${GITHUB_STEP_SUMMARY}"

    # Fork PRs get a read-only token, so they can't comment; they still get the job summary.
    # The header is unique per class, otherwise every job would overwrite the same sticky comment.
    - name: "Add benchmarks in PR Comment"
      uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88
      if: success() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
      with:
        header: benchmark-report-${{ matrix.name }}
        path: ${{ env.BENCHMARKS_COMMENT }}

    - name: "Upload Benchmark Results"
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: always()
      with:
        name: 'BenchmarkResults-${{ matrix.name }}'
        path: |
          ${{ env.BENCHMARKS_ARTIFACTS }}/**/*
          ${{ env.BENCHMARKS_REPORT }}
        if-no-files-found: error
